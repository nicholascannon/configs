modelRoles:
  default: openrouter/deepseek/deepseek-v4-flash-0731:high
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
hideThinkingBlock: true
composer:
  shape: claude
tui:
  vimMode: true
  vimModeDisplay: text
github:
  enabled: true
commands:
  enableClaudeUser: false
skills:
  # obra/superpowers skill collection, installed and kept current by the pi
  # package; format matches omp's customDirectories layout (*/SKILL.md)
  customDirectories:
    - ~/.pi/agent/git/github.com/obra/superpowers/skills
startup:
  # Setup already complete; don't re-run the wizard on version bumps
  setupWizard: false
display:
  # Surface token cost per turn for budget awareness
  showTokenUsage: true