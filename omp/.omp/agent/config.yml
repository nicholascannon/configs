modelRoles:
  default: openrouter/deepseek/deepseek-v4-flash-0731:high
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
hideThinkingBlock: true
composer:
  shape: claude
tui:
  vimMode: true
  vimModeDisplay: text
github:
  enabled: true
commands:
  enableClaudeUser: false
startup:
  # Setup already complete; don't re-run the wizard on version bumps
  setupWizard: false
marketplace:
  # Auto-install newer catalog plugin versions on startup (superpowers etc.)
  autoUpdate: auto
display:
  # Surface token cost per turn for budget awareness
  showTokenUsage: true