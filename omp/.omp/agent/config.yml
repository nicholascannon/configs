  slow: openrouter/deepseek/deepseek-v4-pro-0813:max
  smol: openrouter/deepseek/deepseek-v4-flash-0731:low
  tiny: openrouter/deepseek/deepseek-v4-flash-0731:low
  commit: openrouter/deepseek/deepseek-v4-flash-0731:low
  vision: openrouter/z-ai/glm-5.3-flash:low
task:
  enableEffort: true
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
hideThinkingBlock: true
